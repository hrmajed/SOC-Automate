[project]
name = "soc-copilot"
version = "0.1.0"
description = "Local, context-aware SOC alert triage and investigation agent with guardrails"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["soc_copilot*"]

[tool.setuptools.package-data]
soc_copilot = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
